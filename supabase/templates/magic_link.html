<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="supported-color-schemes" content="dark" />
    <title>Seu código · Meu Racha</title>
  </head>
  <body
    style="margin: 0; padding: 0; background-color: #07180f"
    bgcolor="#07180F"
  >
    <!-- prévia que o app de e-mail mostra na lista, antes de abrir -->
    <div style="display: none; max-height: 0; overflow: hidden">
      Seu código para confirmar o e-mail: {{ .Token }}
    </div>
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      bgcolor="#07180F"
      style="background-color: #07180f"
    >
      <tr>
        <td align="center" style="padding: 32px 16px">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="max-width: 480px"
          >
            <tr>
              <td
                style="
                  padding: 0 4px 24px;
                  font-family: Manrope, Arial, Helvetica, sans-serif;
                  font-size: 26px;
                  font-weight: 800;
                  letter-spacing: -0.5px;
                "
              >
                <span style="color: #f4f6f1">meu</span
                ><span style="color: #c6f24e">racha</span>
              </td>
            </tr>
            <tr>
              <td
                bgcolor="#0F2A1B"
                style="
                  background-color: #0f2a1b;
                  border-radius: 16px;
                  padding: 32px 24px;
                  font-family: Manrope, Arial, Helvetica, sans-serif;
                "
              >
                <h1
                  style="
                    margin: 0 0 8px;
                    font-size: 22px;
                    line-height: 28px;
                    font-weight: 800;
                    color: #f4f6f1;
                  "
                >
                  Seu código
                </h1>
                <p
                  style="
                    margin: 0 0 24px;
                    font-size: 16px;
                    line-height: 24px;
                    color: #f4f6f1;
                  "
                >
                  Digite no app para confirmar seu e-mail.
                </p>
                <table
                  role="presentation"
                  width="100%"
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                >
                  <tr>
                    <td
                      align="center"
                      bgcolor="#07180F"
                      style="
                        background-color: #07180f;
                        border-radius: 12px;
                        padding: 20px 8px;
                        font-family:
                          &quot;Barlow Condensed&quot;,
                          &quot;Arial Narrow&quot;, Arial, sans-serif;
                        font-size: 40px;
                        line-height: 44px;
                        font-weight: 700;
                        letter-spacing: 10px;
                        color: #c6f24e;
                      "
                    >
                      {{ .Token }}
                    </td>
                  </tr>
                </table>
                <p
                  style="
                    margin: 24px 0 0;
                    font-size: 14px;
                    line-height: 20px;
                    color: #8c948d;
                  "
                >
                  Vale por 10 minutos e serve uma vez só. Se não foi você,
                  ignore este e-mail.
                </p>
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 24px 4px 0;
                  font-family: Manrope, Arial, Helvetica, sans-serif;
                  font-size: 12px;
                  line-height: 16px;
                  color: #8c948d;
                "
              >
                Organize. Sorteie. Jogue.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
