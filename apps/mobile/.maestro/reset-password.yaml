appId: app.meuracha
name: Redefinir senha pelo link
---
- launchApp:
    clearState: true
    clearKeychain: true
    arguments:
      RCT_jsLocation: "localhost:8082"
- extendedWaitUntil:
    visible: "Entrar"
    timeout: 20000
- openLink: "meuracha://reset-password?token_hash=${E2E_RESET_TOKEN}"
- extendedWaitUntil:
    visible: "Nova senha"
    timeout: 20000
# o link pode ser de outra conta: a tela diz de quem é a senha antes de trocar
- assertVisible: "Para a conta ${E2E_RESET_EMAIL}"
